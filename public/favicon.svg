<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cf-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="cf-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="cf-cyan" x1="12" y1="14" x2="52" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cf-purple" x1="24" y1="16" x2="54" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="cf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#cf-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" stroke="url(#cf-border)" stroke-width="1.5"/>

  <!-- CineFlow "C" Arc -->
  <path d="M34 16 A 17 17 0 1 0 34 48" fill="none" stroke="url(#cf-cyan)" stroke-width="5" stroke-linecap="round"/>

  <!-- CineFlow "F" Stem & Crossbars -->
  <path d="M34 16 L49 16" fill="none" stroke="url(#cf-purple)" stroke-width="5" stroke-linecap="round"/>
  <path d="M34 29 L45 29" fill="none" stroke="url(#cf-purple)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M34 16 L34 48" fill="none" stroke="url(#cf-purple)" stroke-width="5" stroke-linecap="round"/>

  <!-- Flow Light Ribbon (Glowing S-curve through center) -->
  <path d="M19 40 C 25 40, 27 24, 38 24 C 44 24, 47 31, 52 30" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" filter="url(#cf-glow)"/>

  <!-- Playhead Triangle (Cinematic Core) -->
  <polygon points="26,27 26,37 35,32" fill="#00f2fe" filter="url(#cf-glow)"/>
</svg>